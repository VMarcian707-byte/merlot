<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d12"/>
      <stop offset="50%" style="stop-color:#0a0608"/>
      <stop offset="100%" style="stop-color:#1a0d12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#F7E7CE"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B3A42"/>
      <stop offset="100%" style="stop-color:#722F37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.15"/>
  
  <!-- Wine glass -->
  <g filter="url(#glow)">
    <!-- Glass bowl -->
    <path d="M 196 160 Q 196 240 256 270 Q 316 240 316 160 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <path d="M 196 160 L 316 160" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    
    <!-- Wine fill -->
    <path d="M 206 180 Q 206 230 256 255 Q 306 230 306 180 Z" fill="url(#wineGrad)" opacity="0.6"/>
    
    <!-- Stem -->
    <line x1="256" y1="270" x2="256" y2="340" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Base -->
    <ellipse cx="256" cy="340" rx="40" ry="8" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  </g>
  
  <!-- NFC waves -->
  <g opacity="0.6">
    <path d="M 350 200 Q 370 230 350 260" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 365 185 Q 395 230 365 275" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 380 170 Q 420 230 380 290" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>
  
  <!-- VIP text -->
  <text x="256" y="410" text-anchor="middle" fill="url(#goldGrad)" font-family="serif" font-size="36" font-weight="600" letter-spacing="12" filter="url(#glow)">VIP</text>
  
  <!-- Decorative dots -->
  <circle cx="180" cy="410" r="3" fill="#D4AF37" opacity="0.5"/>
  <circle cx="332" cy="410" r="3" fill="#D4AF37" opacity="0.5"/>
</svg>
