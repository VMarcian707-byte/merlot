version: '3.8'

services:
  # Backend API
  backend:
    build: .
    container_name: merlot-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=merlot_vip
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-merlot_secret_password}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-32-char-string}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - merlot-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: merlot-postgres
    environment:
      - POSTGRES_DB=merlot_vip
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-merlot_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/models/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - merlot-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: merlot-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@merlot.ro}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - merlot-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  merlot-network:
    driver: bridge
